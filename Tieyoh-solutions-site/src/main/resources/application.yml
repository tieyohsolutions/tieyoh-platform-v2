server:
  port: ${PORT:8080}

spring:
  application:
    name: tieyoh-solutions-site
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tieyoh_solutions}
    username: ${SPRING_DATASOURCE_USERNAME:tieyoh}
    password: ${SPRING_DATASOURCE_PASSWORD:tieyoh}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  uploads-dir: ${UPLOADS_DIR:./uploads}
  admin:
    email: ${ADMIN_EMAIL:admin@tieyoh.com}
    password: ${ADMIN_PASSWORD:ChangeMe123!}
    name: ${ADMIN_NAME:Tieyoh Admin}

logging:
  level:
    com.tieyoh: INFO
