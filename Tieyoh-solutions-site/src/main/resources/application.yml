server:
  port: ${PORT:8080}

spring:
  application:
    name: tieyoh-solutions-site
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tieyoh_solutions}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  mail:
    host: ${MAIL_HOST:smtp.fastmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000

app:
  uploads-dir: ${UPLOADS_DIR:./uploads}
  admin:
    email: ${ADMIN_EMAIL:admin@tieyoh.com}
    password: ${ADMIN_PASSWORD}
    name: ${ADMIN_NAME:Tieyoh Admin}
  mail:
    from: ${MAIL_FROM:hany.georgy@tieyoh.com}
  notify:
    email: ${NOTIFY_EMAIL:hany.georgy@tieyoh.com}
    sms-email: ${NOTIFY_SMS_EMAIL:}

logging:
  level:
    com.tieyoh: INFO
