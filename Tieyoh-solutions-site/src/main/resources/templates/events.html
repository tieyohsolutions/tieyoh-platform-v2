<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Events')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<header class="bg-light py-5">
    <div class="container">
        <h1 class="fw-bold">Events</h1>
        <p class="lead text-muted">Public Tieyoh events, webinars, and community meetups. Members get access to additional invite-only sessions.</p>
    </div>
</header>

<section class="container py-5">
    <div th:if="${#lists.isEmpty(events)}" class="text-muted">
        No public events are scheduled right now. Check back soon, or
        <a th:href="@{/auth/signup}">request member access</a> for invite-only sessions.
    </div>
    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="event : ${events}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h2 class="h5 fw-bold" th:text="${event.title}">Event title</h2>
                    <p class="text-muted small mb-1" th:text="${#temporals.format(event.eventDate, 'MMMM d, yyyy - h:mm a')}">Date</p>
                    <p class="text-muted small" th:if="${event.location}" th:text="${event.location}">Location</p>
                    <p th:text="${event.description}">Description</p>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
