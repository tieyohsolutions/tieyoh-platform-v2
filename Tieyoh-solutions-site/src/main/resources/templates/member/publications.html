<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Publications')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<header class="bg-light py-4">
    <div class="container d-flex align-items-center gap-3">
        <img th:src="@{/images/tieyoh-logo-full.jpg}" alt="Tieyoh" style="height: 48px;" class="rounded d-none d-sm-block">
        <div>
            <h1 class="fw-bold h3 mb-1">Publications</h1>
            <p class="text-muted mb-0">The full publications archive, including member-only content.</p>
        </div>
    </div>
</header>

<section class="container py-5">
    <div th:if="${#lists.isEmpty(publications)}" class="text-muted">No publications yet.</div>
    <div class="row g-4">
        <div class="col-md-6" th:each="pub : ${publications}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <span class="badge mb-2" th:classappend="${pub.visibility.name() == 'MEMBER_ONLY'} ? 'bg-info' : 'bg-secondary'"
                          th:text="${pub.visibility.name() == 'MEMBER_ONLY'} ? 'Members Only' : 'Public'">Visibility</span>
                    <h2 class="h5 fw-bold" th:text="${pub.title}">Title</h2>
                    <p class="text-muted small mb-2" th:text="${#temporals.format(pub.publishedAt, 'MMMM d, yyyy')}">Date</p>
                    <p th:text="${pub.summary}">Summary</p>
                    <p th:if="${pub.content}" th:text="${pub.content}" class="small">Content</p>
                    <a th:if="${pub.externalUrl}" th:href="${pub.externalUrl}" target="_blank" rel="noopener" class="small">Read more &rarr;</a>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
