<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<header class="bg-light py-4">
    <div class="container">
        <h1 class="fw-bold h3" th:text="'Welcome, ' + ${user.name}">Welcome</h1>
        <p class="text-muted mb-0" th:text="${user.email}">email</p>
    </div>
</header>

<section class="container py-5">
    <div class="row g-4">
        <div class="col-md-4">
            <a th:href="@{/member/documents}" class="text-decoration-none">
                <div class="card h-100 shadow-sm card-stat">
                    <div class="card-body text-center">
                        <div class="h2 fw-bold text-info" th:text="${documentCount}">0</div>
                        <div class="text-muted">Documents</div>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/member/events}" class="text-decoration-none">
                <div class="card h-100 shadow-sm card-stat">
                    <div class="card-body text-center">
                        <div class="h2 fw-bold text-info" th:text="${eventCount}">0</div>
                        <div class="text-muted">Events</div>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/member/publications}" class="text-decoration-none">
                <div class="card h-100 shadow-sm card-stat">
                    <div class="card-body text-center">
                        <div class="h2 fw-bold text-info" th:text="${publicationCount}">0</div>
                        <div class="text-muted">Publications</div>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <div class="mt-5">
        <a th:href="@{/member/profile}" class="btn btn-outline-dark">View profile</a>
    </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
