<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Events')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<header class="bg-light py-4">
    <div class="container">
        <h1 class="fw-bold h3">Events</h1>
        <p class="text-muted mb-0">Public and member-only events, all in one place.</p>
    </div>
</header>

<section class="container py-5">
    <div th:if="${#lists.isEmpty(events)}" class="text-muted">No events scheduled yet.</div>
    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="event : ${events}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <span class="badge mb-2" th:classappend="${event.visibility.name() == 'MEMBER_ONLY'} ? 'bg-info' : 'bg-secondary'"
                          th:text="${event.visibility.name() == 'MEMBER_ONLY'} ? 'Members Only' : 'Public'">Visibility</span>
                    <h2 class="h5 fw-bold" th:text="${event.title}">Event title</h2>
                    <p class="text-muted small mb-1" th:text="${#temporals.format(event.eventDate, 'MMMM d, yyyy - h:mm a')}">Date</p>
                    <p class="text-muted small" th:if="${event.location}" th:text="${event.location}">Location</p>
                    <p th:text="${event.description}">Description</p>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
