<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<section class="container py-5" style="max-width: 560px;">
    <h1 class="fw-bold mb-4">My Profile</h1>
    <dl class="row">
        <dt class="col-sm-4">Name</dt>
        <dd class="col-sm-8" th:text="${user.name}">Name</dd>

        <dt class="col-sm-4">Email</dt>
        <dd class="col-sm-8" th:text="${user.email}">Email</dd>

        <dt class="col-sm-4">Company</dt>
        <dd class="col-sm-8" th:text="${user.company} ?: '—'">Company</dd>

        <dt class="col-sm-4">Title</dt>
        <dd class="col-sm-8" th:text="${user.title} ?: '—'">Title</dd>

        <dt class="col-sm-4">Role</dt>
        <dd class="col-sm-8" th:text="${user.role}">Role</dd>

        <dt class="col-sm-4">Member since</dt>
        <dd class="col-sm-8" th:text="${#temporals.format(user.createdAt, 'MMMM d, yyyy')}">Date</dd>
    </dl>
    <p class="text-muted small">Profile editing and password changes aren't wired up in this scaffold yet &mdash; add an update form backed by <code>UserService</code> when you're ready.</p>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
