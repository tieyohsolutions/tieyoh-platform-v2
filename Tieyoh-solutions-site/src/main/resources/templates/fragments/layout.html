<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Tieyoh Solutions'">Tieyoh Solutions</title>
    <link rel="icon" type="image/png" th:href="@{/images/tieyoh-icon.png}">
    <link rel="apple-touch-icon" th:href="@{/images/tieyoh-icon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top" th:fragment="navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <img th:src="@{/images/tieyoh-logo-wordmark.png}" alt="Tieyoh Solutions" height="46">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navMain">
            <ul class="navbar-nav mb-2 mb-lg-0 align-items-lg-center">
                <li class="nav-item"><a class="nav-link fw-bold" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link fw-bold" th:href="@{/about}">About</a></li>
                <li class="nav-item"><a class="nav-link fw-bold" th:href="@{/investors}">Investors</a></li>
                <li class="nav-item"><a class="nav-link fw-bold" th:href="@{/events}">Events</a></li>
                <li class="nav-item"><a class="nav-link fw-bold" th:href="@{/publications}">Publications</a></li>
                <li class="nav-item"><a class="nav-link fw-bold" th:href="@{/careers}">Careers</a></li>
                <li class="nav-item"><a class="nav-link fw-bold" th:href="@{/contact}">Contact</a></li>
            </ul>
            <ul class="navbar-nav ms-lg-3 align-items-lg-center">
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link fw-bold" th:href="@{/auth/login}">Log in</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-info btn-sm ms-lg-2" th:href="@{/auth/signup}">Request Access</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle fw-bold" href="#" role="button" data-bs-toggle="dropdown">
                        My Account
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/member/dashboard}">Dashboard</a></li>
                        <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item" th:href="@{/admin/members}">Admin</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/auth/logout}" method="post">
                                <button class="dropdown-item" type="submit">Log out</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
<footer class="bg-dark text-light py-4 mt-5" th:fragment="footer">
    <div class="container text-center small">
        <p class="mb-1">&copy; <span th:text="${currentYear}">2026</span> Tieyoh Solutions. All rights reserved.</p>
        <p class="mb-0 text-muted">Confidential materials on this site are intended for approved members only.</p>
    </div>
</footer>
<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
