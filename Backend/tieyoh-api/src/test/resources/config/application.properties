# Test classpath only (DEF-001). Spring Boot reads classpath:/config/ after,
# and with higher precedence than, classpath:/application.properties, so
# this overrides the dev database URL from src/main/resources for every
# test. A test that starts a DataSource without a Testcontainers
# @ServiceConnection (see com.tieyoh.api.TestcontainersConfiguration) fails
# on an unresolvable host instead of ever touching the dev database on
# localhost:5432. Not on the application classpath: spring-boot:run and the
# packaged jar never see this file.
spring.datasource.url=jdbc:postgresql://dev-database-not-allowed-in-tests.invalid:1/none
