spring.application.name=tieyoh-api

spring.datasource.url=jdbc:postgresql://localhost:5432/tieyoh
spring.datasource.username=${DB_USERNAME:tieyoh}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Actuator (REQ-001). Only health and info are exposed over HTTP; every
# other actuator endpoint stays unexposed. /actuator/info is public (no
# auth layer exists yet -- revisit before first production launch) and
# shows only build name/version/time and git short commit id/commit
# time/dirty flag. The env/java/os/process/ssl contributors are switched
# off explicitly so no environment, config, runtime or host details can
# leak through /actuator/info. The git contributor is pinned in code
# (com.tieyoh.api.actuator.BuildInfoConfiguration).
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=false
management.info.java.enabled=false
management.info.os.enabled=false
management.info.process.enabled=false
management.info.ssl.enabled=false

# Add to Google Wallet -- com.tieyoh.api.wallet.service.GoogleWalletService.
# Both blank by default: the wallet endpoints respond with
# {"configured": false} and no JWT until real values are set here, so
# nothing crashes or half-works before Tieyoh has a Google Wallet issuer
# account. See developers.google.com/wallet/generic/getting-started/issuer-onboarding
# for how to get these two values.
#   GOOGLE_WALLET_ISSUER_ID            -- the numeric Issuer ID shown in
#     the Google Wallet Console once you accept its terms of service.
#   GOOGLE_WALLET_SERVICE_ACCOUNT_KEY_PATH -- filesystem path to the JSON
#     key downloaded for a service account that's been added as an
#     authorized user on that issuer account. Never commit this file --
#     point this at wherever it actually lives on the server (or set the
#     env var in whatever secret store the deploy uses).
google.wallet.issuer-id=${GOOGLE_WALLET_ISSUER_ID:}
google.wallet.service-account-key-path=${GOOGLE_WALLET_SERVICE_ACCOUNT_KEY_PATH:}
# Optional: a real, publicly-fetchable HTTPS image URL for the pass's
# logo (Google Wallet fetches it, so it can't be a local drawable).
# Left blank, the pass just renders without a custom logo -- once
# Tieyoh's brand mark is hosted somewhere public, set this and it
# picks it up with no code change.
google.wallet.logo-url=${GOOGLE_WALLET_LOGO_URL:}
